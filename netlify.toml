[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true
  conditions = { Language = ["fr"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# Diapos du cours : non indexées
[[headers]]
  for = "/courses/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
